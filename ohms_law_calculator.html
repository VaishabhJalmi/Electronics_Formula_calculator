<!DOCTYPE html>
<html>

<div id="calculator">
  <div id="inputs">
    <label for="voltage">Voltage (V):</label>
    <input type="number" id="voltage" value="0">
    <br>
    <label for="resistance">Resistance (Ω):</label>
    <input type="number" id="resistance" value="0">
    <br>
    <label for="current">Current (A):</label>
    <input type="number" id="current" value="0">
  </div>
  <button id="calculate">Calculate</button>
</div>


</html>
